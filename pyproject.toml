[project]
name = "nb-pyexporter"
version = "0.1.0"
description = "Convert handcalcs/Jupyter notebooks into clean plain Python scripts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "nbconvert>=7.17.2",
]

[project.scripts]
nb-pyexporter = "nb_pyexporter:main"

[project.entry-points."nbconvert.exporters"]
cleanpy = "nb_pyexporter.exporter:CleanPythonExporter"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
