[project]
name = "hc-migrate"
version = "0.2.0"
description = "Turn Jupyter notebooks into handcalcs v2 scripts, and migrate handcalcs v1 notebooks and scripts to v2."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Connor Ferster" }]
requires-python = ">=3.11"
# black formats the exported scripts.
dependencies = ["black>=25.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Jupyter",
    "Environment :: Console",
]

[project.optional-dependencies]
# `jupyter nbconvert --to hcpy`: the export as an nbconvert exporter.
nbconvert = ["nbconvert>=7.16"]

[project.scripts]
hc-migrate = "hc_migrate.cli:main"

[project.entry-points."nbconvert.exporters"]
hcpy = "hc_migrate.nbconvert_exporter:HandcalcsScriptExporter"

[project.urls]
Homepage = "https://github.com/StructuralPython/hc-migrate"
"handcalcs v1 → v2 guide" = "https://handcalcs.structuralpython.com/getting-started/migrating-from-v1.html"

[dependency-groups]
# handcalcs v2 checks that converted cells parse and render.
test = [
    "pytest>=8",
    "ipython>=9.18.1",
    "handcalcs>=2.0.0rc5",
    "sympy>=1.12",
    "nbconvert>=7.16",
]
lint = ["black>=25.1"]
# The documentation site (docs/), built and published by publish-docs-to-bunny.yml.
doc = [
    "sphinx>=8.1",
    "shibuya>=2025.1",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
